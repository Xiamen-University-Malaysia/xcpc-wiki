site_name: XMUM XCPC Wiki
site_description: 厦门大学马来西亚分校 XCPC 知识库
site_author: Algorithm Contest Interest Group
repo_url: https://github.com/Xiamen-University-Malaysia/xcpc-wiki
repo_name: Xiamen-University-Malaysia/xcpc-wiki

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # 浅色模式
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    # 深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式

plugins:
  - search
  - git-committers:
      repository: Xiamen-University-Malaysia/xcpc-wiki
      branch: main
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - gen-files:
      scripts:
        - gen_cpp_pages.py

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["docs"]
  - admonition
  - pymdownx.details
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - 简介: 
    - 首页: index.md
    - 如何贡献: contributing.md
    - 感谢: thanks.md
  - 题解: 
